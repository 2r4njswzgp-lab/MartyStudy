<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d14" />
  <meta name="description" content="MartyStudy – uč se chytře, pamatuj si víc. Zábavná pomůcka pro 3. třídu." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MartyStudy" />
  <title>MartyStudy</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Obsah aplikace se vykresluje sem -->
  <main id="app" class="app"></main>

  <!-- Spodní navigace -->
  <nav class="bottomnav" id="bottomnav">
    <button class="navbtn" data-nav="home">
      <span class="navicon">🏠</span><span class="navlabel">Domů</span>
    </button>
    <button class="navbtn" data-nav="subjects">
      <span class="navicon">📚</span><span class="navlabel">Předměty</span>
    </button>
    <button class="navbtn" data-nav="practice">
      <span class="navicon">🎯</span><span class="navlabel">Procvičit</span>
    </button>
    <button class="navbtn" data-nav="favorites">
      <span class="navicon">⭐</span><span class="navlabel">Oblíbené</span>
    </button>
  </nav>

  <!-- Vyskakovací oznámení (toast) -->
  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
